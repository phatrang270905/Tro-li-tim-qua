<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Rich Festive Crimson -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E82C4A" />
      <stop offset="50%" stop-color="#CF1B38" />
      <stop offset="100%" stop-color="#A81028" />
    </linearGradient>

    <!-- Subtle Shine on Top of Squircle -->
    <linearGradient id="topShine" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Ribbon White Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7FAFC" />
    </linearGradient>

    <!-- Ribbon Shadow/Depth Gradient -->
    <linearGradient id="ribbonDepth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.4" />
    </linearGradient>

    <!-- Center Gold Dot Gradient -->
    <linearGradient id="goldGrad" x1="30%" y1="20%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="45%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#5C0615" flood-opacity="0.28" />
    </filter>
    <filter id="ribbonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6B0B1A" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Base Squircle with Shadow -->
  <rect x="14" y="14" width="172" height="172" rx="44" ry="44" fill="url(#bgGrad)" filter="url(#softShadow)" />

  <!-- Inner border stroke for premium finish -->
  <rect x="15" y="15" width="170" height="170" rx="43" ry="43" fill="none" stroke="url(#topShine)" stroke-width="2" />

  <!-- Ribbon Group with Bow / Petal loops -->
  <g filter="url(#ribbonShadow)">
    <!-- 4 Diagonal Ribbon Bow Folds (Inner depth) -->
    <!-- Top-Right Ribbon Fold -->
    <path d="M100 100 C110 75 135 60 152 76 C162 86 150 115 100 100 Z" fill="url(#ribbonDepth)" opacity="0.6" />
    <!-- Bottom-Left Ribbon Fold -->
    <path d="M100 100 C90 125 65 140 48 124 C38 114 50 85 100 100 Z" fill="url(#ribbonDepth)" opacity="0.6" />

    <!-- 4 Primary Gift Bow Petals (Main White Loops) -->
    <!-- Top Petal Loop -->
    <path d="M100 100 C80 62 70 38 100 36 C130 38 120 62 100 100 Z" fill="url(#ribbonGrad)" />
    <path d="M100 90 C88 66 84 50 100 48 C116 50 112 66 100 90 Z" fill="#E82C4A" opacity="0.2" />

    <!-- Bottom Petal Loop -->
    <path d="M100 100 C80 138 70 162 100 164 C130 162 120 138 100 100 Z" fill="url(#ribbonGrad)" />
    <path d="M100 110 C88 134 84 150 100 152 C116 150 112 134 100 110 Z" fill="#A81028" opacity="0.25" />

    <!-- Left Petal Loop -->
    <path d="M100 100 C62 80 38 70 36 100 C38 130 62 120 100 100 Z" fill="url(#ribbonGrad)" />
    <path d="M90 100 C66 88 50 84 48 100 C50 116 66 112 90 100 Z" fill="#E82C4A" opacity="0.2" />

    <!-- Right Petal Loop -->
    <path d="M100 100 C138 80 162 70 164 100 C162 130 138 120 100 100 Z" fill="url(#ribbonGrad)" />
    <path d="M110 100 C134 88 150 84 152 100 C150 116 134 112 110 100 Z" fill="#A81028" opacity="0.25" />
  </g>

  <!-- Golden Center Knot / Dot -->
  <circle cx="100" cy="100" r="16" fill="#A81028" opacity="0.3" />
  <circle cx="100" cy="100" r="14" fill="url(#goldGrad)" filter="url(#softShadow)" />
  <circle cx="100" cy="100" r="12" fill="none" stroke="#FEF08A" stroke-width="1.2" opacity="0.75" />
  <!-- Center Highlight Reflection -->
  <ellipse cx="95" cy="95" rx="3.5" ry="2.5" transform="rotate(-30 95 95)" fill="#FFFFFF" opacity="0.85" />
</svg>
